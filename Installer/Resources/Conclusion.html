<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>安装完成</title></head>
<body>
<p>在 Finder 打开一个文件夹，点击工具栏中的 f2s。选择「Open Shell」打开默认终端，「Copy Path」复制当前路径，或「New File…」输入文件名并创建空文件。</p>
<p>如果工具栏没有 f2s，请打开「应用程序」中的 f2s，按提示启用 Finder 扩展。已启用扩展的用户也可以在 Finder 的「显示 → 自定工具栏」中添加 f2s 按钮。</p>
</body>
</html>
